# Second Brain OS — Render Blueprint (100% free, no expiry)
# Free-tier truth (verified Oct 2026):
#   - Render free web services: OK, sleep after 15 min idle, wake in ~1 min.
#   - Render free Postgres: EXPIRES after 30 days → NOT used here.
#     Use Neon free Postgres instead (permanent, no card, 1 GB).
#   - Render free web has NO persistent disk → uploads are ephemeral
#     (lost on restart/redeploy). Fine for demo; paid disk fixes it.
#   - No LLM key? Built-in offline engine works. No Qdrant? Keyword
#     fallback search works. App boots regardless.
#
# Steps:
#   1. Neon (neon.tech, free): New Project → Postgres 16 → copy the
#      connection string (pooled, `postgres://...` form is fine —
#      backend normalizes it automatically).
#   2. Optional Qdrant (cloud.qdrant.io, free tier): create cluster →
#      copy REST URL + API key. Skip = keyword fallback search.
#   3. Render → New → Blueprint → select this repo.
#      Fill: DATABASE_URL (Neon string), NEXT_PUBLIC_API_URL (after
#      backend first deploys, e.g. https://sbo-backend-xxxx.onrender.com),
#      CORS_ORIGINS (frontend URL, e.g. https://sbo-frontend-xxxx.onrender.com),
#      QDRANT_URL + QDRANT_API_KEY (if step 2), OPENAI_API_KEY (or empty).
#   4. After backend is green, set frontend NEXT_PUBLIC_API_URL and
#      trigger manual redeploy of sbo-frontend (NEXT_PUBLIC_* bakes at build).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sbo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste Neon pooled connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: ""
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_MODE
        value: hash # free 512MB cannot hold torch; neural needs Starter+ instance
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # paste frontend URL, e.g. https://sbo-frontend-xxxx.onrender.com
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_MB
        value: 100

  - type: web
    name: sbo-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # paste backend URL, e.g. https://sbo-backend-xxxx.onrender.com
      - key: HOSTNAME
        value: "0.0.0.0" # gateway must reach Next standalone; localhost bind = 502
