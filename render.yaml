# Second Brain OS — Render Blueprint (one-click production deploy)
# Steps:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → select repo (render.yaml auto-detected).
#   3. Fill the prompted values:
#        JWT_SECRET        → auto-generated (or paste your own ≥32 chars)
#        OPENAI_API_KEY    → optional; leave empty for offline fallback engine
#        NEXT_PUBLIC_API_URL → AFTER backend first deploys, paste its public URL
#                             (e.g. https://sbo-backend-xxxx.onrender.com), then
#                             Resume/trigger a manual redeploy of sbo-frontend
#                             (NEXT_PUBLIC_* is baked in at build time).
#        CORS_ORIGINS      → your frontend public URL
#                             (e.g. https://sbo-frontend-xxxx.onrender.com)
#   4. Optional vector search: create a free Qdrant Cloud cluster and set
#      QDRANT_URL + QDRANT_API_KEY on sbo-backend. Without them the API still
#      works — search falls back to keyword mode (graceful degradation).
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: sbo-db
    plan: free
    databaseName: secondbrain
    user: secondbrain

services:
  - type: web
    name: sbo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sbo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: ""
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # paste frontend URL, e.g. https://sbo-frontend-xxxx.onrender.com
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_MB
        value: 100
    disk:
      name: sbo-uploads
      mountPath: /data/uploads
      sizeGB: 1

  - type: web
    name: sbo-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # paste backend URL, e.g. https://sbo-backend-xxxx.onrender.com
