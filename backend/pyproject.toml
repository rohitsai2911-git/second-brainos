[tool.ruff]
# Lint gate: real bugs only (syntax errors, unused imports/vars, ambiguous
# names). Style rules (B, S, BLE, UP, I, …) intentionally off — no churn;
# graceful-degradation code uses broad excepts and FastAPI Depends() defaults
# by design.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402 (import not at top) fires for smoke_test.py's sys.path bootstrap —
# those noqa comments are load-bearing.
