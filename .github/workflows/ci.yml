name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
        working-directory: .
      - name: Compile check
        run: python -m compileall -q app scripts
        working-directory: backend
      - name: Ruff lint
        run: ruff check app scripts
        working-directory: backend
      - name: Smoke test (SQLite, no external services)
        run: python scripts/smoke_test.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Production build (lint + typecheck + build)
        run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet

  compose-boot:
    # Real deploy-path check: build images, boot db+qdrant+backend, hit health.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Boot db + qdrant + backend
        run: docker compose up -d db qdrant backend
      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 10
          done
          echo "backend never became healthy"
          docker compose logs backend
          exit 1
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs db qdrant backend
      - name: Teardown
        if: always()
        run: docker compose down -v
